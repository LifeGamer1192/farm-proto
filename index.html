<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235fae6b'/><rect x='14.5' y='6' width='3' height='10' rx='1.5' fill='%2311240f'/><circle cx='16' cy='19' r='6.5' fill='%2311240f'/></svg>"
    />
    <title>Farm Proto — Alpha 1</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Farm Proto <span class="version">alpha 1</span></h1>
        <p class="tagline">Random map &amp; tile rendering</p>
      </header>

      <main class="layout">
        <section class="canvas-panel">
          <canvas id="map"></canvas>
          <div id="tooltip" class="tooltip" hidden></div>
        </section>

        <aside class="controls">
          <div class="control-group">
            <label for="seed">Seed</label>
            <div class="row">
              <input id="seed" type="text" inputmode="numeric" autocomplete="off" />
              <button id="apply-seed" type="button">Apply</button>
            </div>
            <button id="regenerate" type="button" class="primary">
              Regenerate (random)
            </button>
          </div>

          <div class="control-group">
            <span class="label">View</span>
            <div class="view-modes" id="view-modes">
              <button type="button" data-mode="terrain" class="active">Terrain</button>
              <button type="button" data-mode="fertility">Fertility</button>
              <button type="button" data-mode="moisture">Moisture</button>
              <button type="button" data-mode="sunlight">Sunlight</button>
            </div>
          </div>

          <div class="control-group">
            <span class="label">Map stats</span>
            <dl id="stats" class="stats"></dl>
          </div>

          <div class="control-group">
            <span class="label">Legend</span>
            <div id="legend" class="legend"></div>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
