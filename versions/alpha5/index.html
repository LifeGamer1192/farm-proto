<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235fae6b'/><rect x='14.5' y='6' width='3' height='10' rx='1.5' fill='%2311240f'/><circle cx='16' cy='19' r='6.5' fill='%2311240f'/></svg>"
    />
    <title>Farm Proto — Alpha 5</title>
    <script type="module" crossorigin src="./assets/index-pnJkGHOp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ucgyoKsn.css">
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Farm Proto <span class="version">alpha 5</span></h1>
        <p class="tagline">
          Seasons &amp; temperature shape the farming year ·
          <a id="archive-link" href="./versions/">all versions</a>
        </p>
      </header>

      <main class="layout">
        <section class="canvas-panel">
          <div class="canvas-wrap">
            <canvas id="map"></canvas>
            <div id="tooltip" class="tooltip" hidden></div>
            <button class="scroll-btn scroll-up" data-dir="up" type="button" aria-label="Scroll up">▲</button>
            <button class="scroll-btn scroll-down" data-dir="down" type="button" aria-label="Scroll down">▼</button>
            <button class="scroll-btn scroll-left" data-dir="left" type="button" aria-label="Scroll left">◀</button>
            <button class="scroll-btn scroll-right" data-dir="right" type="button" aria-label="Scroll right">▶</button>
          </div>
          <div id="toast" class="toast" hidden></div>
        </section>

        <aside class="controls">
          <div class="control-group">
            <label for="seed">Seed</label>
            <div class="row">
              <input id="seed" type="text" inputmode="numeric" autocomplete="off" />
              <button id="apply-seed" type="button">Apply</button>
            </div>
            <button id="regenerate" type="button" class="primary">
              Regenerate (random)
            </button>
          </div>

          <div class="control-group">
            <span class="label">Season</span>
            <dl id="env-stats" class="stats"></dl>
          </div>

          <div class="control-group">
            <span class="label">Speed &amp; zoom</span>
            <p class="reason-label">Game speed</p>
            <div class="tools speed5" id="speeds">
              <button type="button" data-speed="0">0.5×</button>
              <button type="button" data-speed="1" class="active">1×</button>
              <button type="button" data-speed="2">2×</button>
              <button type="button" data-speed="3">4×</button>
              <button type="button" data-speed="4">8×</button>
            </div>
            <p class="reason-label">Map zoom</p>
            <div class="tools" id="zooms">
              <button type="button" data-zoom="0">Small</button>
              <button type="button" data-zoom="1" class="active">Medium</button>
              <button type="button" data-zoom="2">Large</button>
            </div>
          </div>

          <div class="control-group">
            <span class="label">Tool</span>
            <div class="tools" id="tools">
              <button type="button" data-tool="move" class="active">Move</button>
              <button type="button" data-tool="harvest">Harvest</button>
              <button type="button" data-tool="sow">Sow</button>
            </div>
          </div>

          <div class="control-group">
            <span class="label">Crop to sow</span>
            <div class="tools" id="crops">
              <button type="button" data-crop="wheat" class="active">Wheat</button>
              <button type="button" data-crop="potato">Potato</button>
              <button type="button" data-crop="bean">Bean</button>
            </div>
          </div>

          <div class="control-group">
            <span class="label">Colony</span>
            <dl id="colony-stats" class="stats"></dl>
            <p class="reason-label">Activity log</p>
            <ul id="event-log" class="task-log"></ul>
          </div>

          <div class="control-group">
            <span class="label">Tasks</span>
            <dl id="task-stats" class="stats"></dl>
            <p class="reason-label">Why this task</p>
            <p id="task-reason" class="reason"></p>
            <button id="clear-tasks" type="button">Clear queue</button>
          </div>

          <div class="control-group">
            <span class="label">Colonist</span>
            <dl id="colonist-stats" class="stats"></dl>
            <button id="center-colonist" type="button">Center camera on colonist</button>
          </div>

          <div class="control-group">
            <span class="label">View</span>
            <div class="view-modes" id="view-modes">
              <button type="button" data-mode="terrain" class="active">Terrain</button>
              <button type="button" data-mode="fertility">Fertility</button>
              <button type="button" data-mode="moisture">Moisture</button>
              <button type="button" data-mode="sunlight">Sunlight</button>
            </div>
          </div>

          <div class="control-group">
            <span class="label">Map stats</span>
            <dl id="map-stats" class="stats"></dl>
          </div>

          <div class="control-group">
            <span class="label">Legend</span>
            <div id="legend" class="legend"></div>
          </div>
        </aside>
      </main>
    </div>

  </body>
</html>
